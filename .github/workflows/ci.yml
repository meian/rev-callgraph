name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  static-checks:
    name: Static checks
    runs-on: ubuntu-26.04
    timeout-minutes: 1
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Check formatting
        shell: bash
        run: |
          unformatted=$(gofmt -l .)
          if [[ -n "$unformatted" ]]; then
            printf '%s\n' "$unformatted"
            exit 1
          fi

      - name: Check module tidiness
        shell: bash
        run: |
          go mod tidy
          changes=$(git status --porcelain --untracked-files=all)
          if [[ -n "$changes" ]]; then
            printf '%s\n' "$changes"
            git diff
            exit 1
          fi

  static-analysis:
    name: Static analysis
    runs-on: ubuntu-26.04
    timeout-minutes: 2
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - run: go vet ./...

      # Staticcheck 2026.2rc1 supports Go 1.27. Keep the tool version pinned.
      - run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.0-rc.1 ./...

  test:
    name: Test
    runs-on: ubuntu-26.04
    timeout-minutes: 1
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - run: go test ./...

  test-race:
    name: Test (race)
    runs-on: ubuntu-26.04
    timeout-minutes: 1
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - run: go test -race ./...

  build:
    name: Build
    runs-on: ubuntu-26.04
    timeout-minutes: 1
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - run: go build .
