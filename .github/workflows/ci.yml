name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: Go quality checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Check formatting
        shell: bash
        run: |
          unformatted=$(gofmt -l .)
          if [[ -n "$unformatted" ]]; then
            printf '%s\n' "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Staticcheck
        # Staticcheck 2026.2rc1 supports Go 1.27. Keep the tool version pinned.
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.0-rc.1 ./...

      - name: Check module tidiness
        shell: bash
        run: |
          go mod tidy
          changes=$(git status --porcelain --untracked-files=all)
          if [[ -n "$changes" ]]; then
            printf '%s\n' "$changes"
            git diff
            exit 1
          fi

      - name: Test
        run: go test ./...

      - name: Test with race detector
        run: go test -race ./...

      - name: Build
        run: go build .
