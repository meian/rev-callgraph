name: Release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: write

jobs:
  release:
    if: github.event.created && !github.event.deleted
    runs-on: ubuntu-26.04
    env:
      GOTOOLCHAIN: local
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build release binaries
        env:
          DIST: ${{ runner.temp }}/dist
          GOFLAGS: -buildvcs=true -trimpath -ldflags=-X=github.com/meian/rev-callgraph/cmd.releaseVersion=${{ github.ref_name }}
        run: |
          git status --porcelain --untracked-files=all > "$RUNNER_TEMP/git-status"
          test ! -s "$RUNNER_TEMP/git-status"
          mkdir "$DIST"
          GOOS=linux GOARCH=amd64 go build -o "$DIST/rev-callgraph-linux-amd64" .
          GOOS=linux GOARCH=arm64 go build -o "$DIST/rev-callgraph-linux-arm64" .
          GOOS=darwin GOARCH=amd64 go build -o "$DIST/rev-callgraph-darwin-amd64" .
          GOOS=darwin GOARCH=arm64 go build -o "$DIST/rev-callgraph-darwin-arm64" .
          GOOS=windows GOARCH=amd64 go build -o "$RUNNER_TEMP/rev-callgraph.exe" .

      - name: Verify release version and VCS information
        shell: bash
        working-directory: ${{ runner.temp }}/dist
        run: |
          test "$(./rev-callgraph-linux-amd64 --version)" = "$GITHUB_REF_NAME (${GITHUB_SHA:0:12})"
          go version -m -json rev-callgraph-* "$RUNNER_TEMP/rev-callgraph.exe" |
            jq -se --arg sha "$GITHUB_SHA" '
              length == 5 and all(.[];
                (.Settings | from_entries) |
                .vcs == "git" and ."vcs.revision" == $sha and ."vcs.modified" == "false")'

      - name: Package Windows binary and checksum release assets
        working-directory: ${{ runner.temp }}/dist
        run: |
          zip -j rev-callgraph-windows-amd64.zip "$RUNNER_TEMP/rev-callgraph.exe"
          sha256sum rev-callgraph-* > SHA256SUMS

      - name: Publish release with verified assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "$RUNNER_TEMP"/dist/* --verify-tag --generate-notes
